          description: ''
  /api/v1/scanner/report/:
    post:
      operationId: scanner_report_create
      description: 'Public: anyone can report. Reports never change a code''s or domain''s
        status by themselves.'
      tags:
      - scanner
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbuseReportCreate'
          application/json:
            schema:
              $ref: '#/components/schemas/AbuseReportCreate'
        required: true
      security:
      - jwtAuthOptional: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/scanner/verify/{token}/:
    get:
      operationId: scanner_verify_retrieve
