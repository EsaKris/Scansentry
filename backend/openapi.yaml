openapi: 3.0.3
info:
  title: ScanSentry API
  version: 1.0.0
  description: Create. Verify. Monitor. Protect.
paths:
  /api/v1/activity/:
    get:
      operationId: activity_list
      description: The signed-in user's own audit trail. Read-only; IP addresses are
        never exposed.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
  /api/v1/analytics/overview/:
    get:
      operationId: analytics_overview_retrieve
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Last N days (default 30)
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
        description: Needs advanced analytics
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - month
          - week
      - in: query
        name: to
        schema:
          type: string
          format: date
      - in: query
        name: tz
        schema:
          type: string
        description: IANA time zone, e.g. Africa/Lagos
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/qr-performance/:
    get:
      operationId: analytics_qr_performance_retrieve
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Last N days (default 30)
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
        description: Needs advanced analytics
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - month
          - week
      - in: query
        name: to
        schema:
          type: string
          format: date
      - in: query
        name: tz
        schema:
          type: string
        description: IANA time zone, e.g. Africa/Lagos
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/scans/:
    get:
      operationId: analytics_scans_retrieve
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Last N days (default 30)
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
        description: Needs advanced analytics
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - month
          - week
      - in: query
        name: qr
        schema:
          type: string
          format: uuid
      - in: query
        name: to
        schema:
          type: string
          format: date
      - in: query
        name: tz
        schema:
          type: string
        description: IANA time zone, e.g. Africa/Lagos
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/me/deletion-request/:
    post:
      operationId: auth_me_deletion_request_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericDetail'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericDetail'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericDetail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericDetail'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericDetail'
          description: ''
  /api/v1/campaigns/:
    get:
      operationId: campaigns_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
    post:
      operationId: campaigns_create
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Campaign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Campaign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Campaign'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/campaigns/{id}/:
    get:
      operationId: campaigns_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
    patch:
      operationId: campaigns_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCampaign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCampaign'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
    delete:
      operationId: campaigns_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/config/:
    get:
      operationId: config_retrieve
      description: Only is_public settings (feature flags, pricing_enabled, ...).
      tags:
      - config
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/domains/analyze/:
    post:
      operationId: domains_analyze_create
      description: Public domain checker (rate-limited). Signed-in users also get
        history and may force a refresh.
      tags:
      - domains
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainAnalyzeRequest'
        required: true
      security:
      - jwtAuthOptional: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/domains/assessments/{id}/:
    get:
      operationId: domains_assessments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - domains
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/domains/history/:
    get:
      operationId: domains_history_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - domains
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoryList'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/read/:
    post:
      operationId: notifications_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/preferences/:
    get:
      operationId: notifications_preferences_retrieve
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preference'
          description: ''
    patch:
      operationId: notifications_preferences_partial_update
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPreference'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPreference'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPreference'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preference'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: notifications_read_all_create
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: notifications_unread_count_retrieve
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/qr/:
    get:
      operationId: qr_list
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: query
        name: campaign
        schema:
          type: string
          format: uuid
      - in: query
        name: code_mode
        schema:
          type: string
          enum:
          - dynamic
          - static
        description: |-
          * `static` - Static
          * `dynamic` - Dynamic
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: qr_type
        schema:
          type: string
          enum:
          - email
          - file
          - landing
          - phone
          - social
          - text
          - url
          - vcard
          - whatsapp
          - wifi
        description: |-
          * `url` - Website URL
          * `whatsapp` - WhatsApp
          * `phone` - Telephone
          * `email` - Email
          * `wifi` - Wi-Fi
          * `vcard` - Contact card
          * `social` - Social profile
          * `file` - PDF / file link
          * `landing` - Custom landing page
          * `text` - Plain text
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - disabled
          - paused
        description: |-
          * `active` - Active
          * `paused` - Paused
          * `disabled` - Disabled
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQRCodeList'
          description: ''
    post:
      operationId: qr_create
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      tags:
      - qr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRCodeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRCodeCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
  /api/v1/qr/{id}/:
    get:
      operationId: qr_retrieve
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
    patch:
      operationId: qr_partial_update
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - qr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQRCodeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQRCodeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQRCodeUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
    delete:
      operationId: qr_destroy
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/qr/{id}/activate/:
    post:
      operationId: qr_activate_create
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
  /api/v1/qr/{id}/activity/:
    get:
      operationId: qr_activity_list
      description: Everything that happened to one QR code (owner only), including
        staff/system actions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
  /api/v1/qr/{id}/analytics/:
    get:
      operationId: qr_analytics_retrieve
      description: GET /qr/{id}/analytics/ - scans for one code (owner only).
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Last N days (default 30)
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
        description: Needs advanced analytics
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - month
          - week
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: to
        schema:
          type: string
          format: date
      - in: query
        name: tz
        schema:
          type: string
        description: IANA time zone, e.g. Africa/Lagos
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/qr/{id}/disable/:
    post:
      operationId: qr_disable_create
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
  /api/v1/qr/{id}/history/:
    get:
      operationId: qr_history_list
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: query
        name: campaign
        schema:
          type: string
          format: uuid
      - in: query
        name: code_mode
        schema:
          type: string
          enum:
          - dynamic
          - static
        description: |-
          * `static` - Static
          * `dynamic` - Dynamic
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: qr_type
        schema:
          type: string
          enum:
          - email
          - file
          - landing
          - phone
          - social
          - text
          - url
          - vcard
          - whatsapp
          - wifi
        description: |-
          * `url` - Website URL
          * `whatsapp` - WhatsApp
          * `phone` - Telephone
          * `email` - Email
          * `wifi` - Wi-Fi
          * `vcard` - Contact card
          * `social` - Social profile
          * `file` - PDF / file link
          * `landing` - Custom landing page
          * `text` - Plain text
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - disabled
          - paused
        description: |-
          * `active` - Active
          * `paused` - Paused
          * `disabled` - Disabled
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQRDestinationHistoryList'
          description: ''
  /api/v1/qr/{id}/image/{fmt}/:
    get:
      operationId: qr_image_retrieve
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: query
        name: download
        schema:
          type: boolean
      - in: path
        name: fmt
        schema:
          type: string
          pattern: ^png|svg|pdf$
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/qr/{id}/logo/:
    post:
      operationId: qr_logo_create
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - qr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
    delete:
      operationId: qr_logo_destroy
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/qr/{id}/pause/:
    post:
      operationId: qr_pause_create
      description: 'Every queryset is scoped to the requesting user: other users''
        codes return 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
