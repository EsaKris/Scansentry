        required: true
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
  /api/v1/qr/preview/:
    post:
      operationId: qr_preview_create
      description: Render a PNG without saving anything. Dynamic previews use a placeholder
        URL.
      tags:
      - qr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRPreview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QRPreview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QRPreview'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/scanner/analyze/:
    post:
      operationId: scanner_analyze_create
