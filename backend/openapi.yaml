      - data
      - name
      - qr_type
    QRDestinationHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        previous_destination:
          type: string
          format: uri
          readOnly: true
        new_destination:
          type: string
          format: uri
          readOnly: true
        changed_by:
          type: string
          nullable: true
          readOnly: true
        change_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - change_reason
      - changed_by
      - created_at
      - id
      - new_destination
      - previous_destination
    QRPreview:
      type: object
      properties:
        qr_type:
          $ref: '#/components/schemas/QrTypeEnum'
        code_mode:
          allOf:
          - $ref: '#/components/schemas/CodeModeEnum'
          default: static
        data:
          type: object
          additionalProperties: {}
        style:
          $ref: '#/components/schemas/Style'
      required:
      - data
      - qr_type
    QrTypeEnum:
      enum:
      - url
      - whatsapp
      - phone
      - email
      - wifi
      - vcard
      - social
      - file
      - landing
      - text
      type: string
      description: |-
        * `url` - Website URL
        * `whatsapp` - WhatsApp
        * `phone` - Telephone
        * `email` - Email
        * `wifi` - Wi-Fi
        * `vcard` - Contact card
        * `social` - Social profile
        * `file` - PDF / file link
        * `landing` - Custom landing page
        * `text` - Plain text
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          maxLength: 80
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    ScannerTypeEnum:
      enum:
      - camera
      - upload
      type: string
      description: |-
        * `camera` - camera
        * `upload` - upload
    SecurityAnalyzeRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
        trace:
          type: boolean
          default: true
          description: Follow redirects of known URL shorteners
        ai:
          type: boolean
          default: false
          description: Request an AI-worded explanation (signed-in, if enabled)
      required:
      - url
    SeverityEnum:
      enum:
      - info
      - warning
      - critical
      type: string
      description: |-
        * `info` - Info
        * `warning` - Warning
        * `critical` - Critical
    StatusEnum:
      enum:
      - active
      - paused
      - disabled
      type: string
      description: |-
        * `active` - Active
        * `paused` - Paused
        * `disabled` - Disabled
    Style:
      type: object
      properties:
        fg_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        bg_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        error_correction:
          $ref: '#/components/schemas/ErrorCorrectionEnum'
        box_size:
          type: integer
          maximum: 20
          minimum: 5
        frame_text:
          type: string
          maxLength: 30
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 80
        email_verified:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deletion_requested_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - deletion_requested_at
      - email
      - email_verified
      - id
      - is_staff
      - updated_at
    VerifyEmail:
      type: object
      properties:
        token:
          type: string
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jwtAuthOptional:
      type: http
      scheme: bearer
      bearerFormat: JWT
