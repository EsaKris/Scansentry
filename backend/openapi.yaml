components:
  schemas:
    AbuseReportCreate:
      type: object
      properties:
        qr_token:
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{16,64}$
          - type: string
            maxLength: 0
        url:
          type: string
          maxLength: 2048
        category:
          $ref: '#/components/schemas/CategoryEnum'
        description:
          type: string
          maxLength: 2000
          minLength: 10
        evidence:
          type: string
          format: uri
          nullable: true
      required:
      - category
      - description
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        actor:
          type: string
          description: Who did it, without exposing staff identities or other users.
          readOnly: true
        before_state:
          readOnly: true
          nullable: true
        after_state:
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - after_state
      - before_state
      - created_at
      - id
      - label
      - object_id
      - object_type
    AnalyzeRequest:
      type: object
      properties:
        content:
          type: string
        assess:
          type: boolean
          default: false
          description: Also run the full security assessment (slower)
        scanner_type:
          allOf:
          - $ref: '#/components/schemas/ScannerTypeEnum'
          default: camera
          description: |-
            How the code was captured (for the owner's analytics)

            * `camera` - camera
            * `upload` - upload
      required:
      - content
    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        qr_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - qr_count
      - updated_at
    CategoryEnum:
      enum:
      - suspicious_qr
      - fraudulent_payment
      - impersonation
      - unexpected_destination
      - malicious_sticker
      - other
      type: string
      description: |-
        * `suspicious_qr` - Suspicious QR code
        * `fraudulent_payment` - Fraudulent payment page
        * `impersonation` - Impersonation
        * `unexpected_destination` - Unexpected destination change
        * `malicious_sticker` - Malicious QR sticker
        * `other` - Other abuse
    CodeModeEnum:
      enum:
      - static
      - dynamic
      type: string
      description: |-
        * `static` - Static
        * `dynamic` - Dynamic
    DecodeRequest:
      type: object
      properties:
        image:
          type: string
          format: uri
        assess:
          type: boolean
          default: false
          description: Also run the full security assessment (slower)
      required:
      - image
    DomainAnalyzeRequest:
      type: object
      properties:
        value:
          type: string
          maxLength: 2048
        refresh:
          type: boolean
          default: false
      required:
      - value
    ErrorCorrectionEnum:
      enum:
      - L
      - M
      - Q
      - H
      type: string
      description: |-
        * `L` - L
        * `M` - M
        * `Q` - Q
        * `H` - H
    GenericDetail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    History:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assessment_id:
          type: string
          format: uuid
          readOnly: true
        domain:
          type: string
        submitted_value:
          type: string
          maxLength: 300
        served_from_cache:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        checked_at:
          type: string
          format: date-time
        domain_health_score:
          type: integer
        registration_status:
          type: string
        hosting_status:
          type: string
        completion_status:
          type: string
      required:
      - assessment_id
      - checked_at
      - completion_status
      - created_at
      - domain
      - domain_health_score
      - hosting_status
      - id
      - registration_status
      - submitted_value
    KindEnum:
      enum:
      - security.destination_flagged
      - qr.disabled
      - qr.restored
      - qr.destination_changed
      - qr.expiring_soon
      - abuse.report_received
      type: string
      description: |-
        * `security.destination_flagged` - Destination flagged
        * `qr.disabled` - QR code disabled
        * `qr.restored` - QR code restored
        * `qr.destination_changed` - Destination changed
        * `qr.expiring_soon` - QR code expiring soon
        * `abuse.report_received` - Abuse report received
    LogoUpload:
      type: object
      properties:
        logo:
          type: string
          format: uri
      required:
      - logo
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        data:
          readOnly: true
        read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - body
      - created_at
      - data
      - id
      - kind
      - read
      - read_at
      - severity
      - title
    PaginatedActivityList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
