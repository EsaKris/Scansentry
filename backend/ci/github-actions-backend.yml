# Copy to <repo root>/.github/workflows/backend.yml  (the backend lives in backend/).
# NOT yet run: this file was written without access to GitHub Actions. Check the first run and adjust.
name: backend
on:
  push: {paths: ["backend/**"]}
  pull_request: {paths: ["backend/**"]}
defaults:
  run: {working-directory: backend}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: scansentry, POSTGRES_PASSWORD: scansentry, POSTGRES_DB: scansentry}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scansentry" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements/production.txt -r requirements/dev.txt
      - name: Tests (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://scansentry:scansentry@localhost:5432/scansentry' || '' }}
        run: pytest
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements/production.txt -r requirements/dev.txt bandit pip-audit
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: OpenAPI is valid and committed
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --settings=config.settings.test
          diff -q /tmp/openapi.yaml openapi.yaml
      - name: Static security scan (medium and above)
        run: bandit -r apps config -ll
      - name: Known-vulnerable dependencies
        run: pip-audit -r requirements/production.txt
